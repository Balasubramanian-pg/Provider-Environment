name: pr-build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: .

jobs:
  deferred-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore prod state (read-only, never saved from PRs)
        id: prod-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cms.duckdb
            ingest/registry.json
            state/manifest.json
          key: cms-prod-state-pr-${{ github.run_id }}
          restore-keys: cms-prod-state-

      - name: dbt deps
        run: dbt deps

      # ---------- deferred path: prod state available ----------
      - name: Generate staging from prod registry
        if: steps.prod-state.outputs.cache-matched-key != ''
        run: python ingest/generate_staging.py

      - name: dbt build (state:modified+, deferred)
        if: steps.prod-state.outputs.cache-matched-key != ''
        run: >
          dbt build --target ci
          --select state:modified+
          --exclude resource_type:snapshot
          --defer --state state

      # ---------- fallback: first run or cache eviction ----------
      - name: Ingest (fallback)
        if: steps.prod-state.outputs.cache-matched-key == ''
        run: python ingest/cms_ingest.py

      - name: Generate staging (fallback)
        if: steps.prod-state.outputs.cache-matched-key == ''
        run: python ingest/generate_staging.py

      - name: dbt build (full, no deferral)
        if: steps.prod-state.outputs.cache-matched-key == ''
        run: dbt build --target prod --exclude resource_type:snapshot

      - name: Job summary
        if: always()
        env:
          CI_MODE: ${{ steps.prod-state.outputs.cache-matched-key != '' && 'deferred' || 'full-fallback' }}
        run: python scripts/ci_summary.py

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-pr-artifacts
          path: |
            target/manifest.json
            target/run_results.json
          retention-days: 7
          if-no-files-found: ignore
