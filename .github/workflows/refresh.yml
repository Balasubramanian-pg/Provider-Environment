name: prod-refresh

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST daily; fastest CMS source refreshes semiweekly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prod-refresh
  cancel-in-progress: false   # never overlap two writers on warehouse state

env:
  DBT_PROFILES_DIR: .

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore warehouse state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cms.duckdb
            ingest/registry.json
            state/manifest.json
          key: cms-prod-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cms-prod-state-

      - name: Ingest CMS datasets
        run: python ingest/cms_ingest.py

      - name: Generate staging
        run: python ingest/generate_staging.py

      - name: dbt deps
        run: dbt deps

      - name: Source freshness
        run: dbt source freshness --target prod
        continue-on-error: true   # upstream lateness is a signal, not a build blocker

      - name: dbt build (models, snapshots, tests)
        run: dbt build --target prod

      - name: dbt docs
        run: dbt docs generate --target prod

      - name: Stage manifest for state cache
        if: success()
        run: |
          mkdir -p state
          cp target/manifest.json state/manifest.json

      - name: Save warehouse state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cms.duckdb
            ingest/registry.json
            state/manifest.json
          key: cms-prod-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Job summary
        if: always()
        env:
          SUMMARY_INGEST: "true"
          CI_MODE: full-refresh
        run: python scripts/ci_summary.py

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-artifacts
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
            target/sources.json
            target/index.html
          retention-days: 14
          if-no-files-found: ignore
